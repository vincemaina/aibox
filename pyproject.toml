[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibox"
version = "0.1.0"
description = "Disposable Docker containers for AI coding agents"
requires-python = ">=3.11"
authors = [{ name = "Vince Maina" }]
license = { text = "MIT" }

[project.scripts]
aibox = "aibox.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aibox.templates" = ["Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
